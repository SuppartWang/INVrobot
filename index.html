const MD_SoftEmbodiedPolicy = `# 项目简介

本项目面向**柔性布料操作**（如抓取、平移、折叠等）的机器人学习任务，提供了一套完整的算法模型训练与部署流程。核心包括：

- **数据采集**：支持遥操作（Teleop）、纯策略推理（Policy）和混合模式（Mixed + DAgger），可同时采集专家数据、推理数据和人工干预数据，输出符合 LeRobot 格式的数据集。
- **策略模型微调**：基于 **π0.5** 视觉‑语言‑动作（VLA）模型进行微调，支持带/不带 Advantage 条件的训练，适配双臂 14 维动作空间。
- **价值模型与 Advantage 标注**：在 π0.5 骨架上附加价值头，分两阶段（Progress Loss + TD Learning）训练，为数据集中的每个动作块计算 **action_advantage**，用于后续优势条件化策略训练。
- **世界模型训练**：基于 LTX‑Video 的扩散式世界模型，学习在给定动作条件下预测未来多视角视频帧，为在线强化学习提供想象环境。
- **在线策略自提升**：参考 **RISE** 框架，利用世界模型（WM）和奖励模型（RM）生成想象 rollout，通过优势信号（GAE）对策略进行在线 RL 微调，实现无需真实试错的策略自我提升。

|   |   |
|---|---|
|**阶段**|**所需资源**|
|数据采集|机械臂|
|π0.5 V0模型训练|GPU服务器|
|Policy WebSocket 远程服务|Jetson Orin NX Super客户端|
|DAgger人工干预数据采集|机械臂、GPU服务器|
|价值模型训练|GPU服务器|
|Advantage策略模型训练|GPU服务器|
|世界动力学模型训练|GPU服务器|
|基于世界模型的在线强化|GPU服务器|

本仓库所使用的框架基于Lerobot框架，使用的机械臂为非官方提供；

如需更换其它机械臂，需自己手动集成到本仓库提供的框架。

|---|---|---|

|\`TELEOP_TYPE\`|遥操作主端类型|\`bi_s1_leader\`|

|\`LEFT_LEADER_PORT\`|左臂主端串口|\`/dev/left_leader\`|
|\`RIGHT_LEADER_PORT\`|右臂主端串口|\`/dev/right_leader\`|
|\`POLICY_TYPE\`|策略客户端类型|\`openpi\`|

|\`OUTPUT_DIR\`|数据输出目录|\`./s1_data\`|

## 4. Policy WebSocket 服务

**我们提供策略推理服务端和部署端分离，使用 WebSocket 实现。**

训练完成后启动策略推理服务，供数据采集端和部署端连接。

\`\`\`bash
cd policy_and_value/policy_offline_and_value

# 启动 WebSocket 策略服务
python scripts/serve_policy.py --port 8000 policy:checkpoint \\
    --policy.config BiS1_Policy_offline_release \\
    --policy.dir checkpoints/BiS1_Policy_offline_release/mix_failure/18000

# 带动作日志记录（JSONL 格式）
python scripts/serve_policy.py --port 8000 --log_file actions.jsonl policy:checkpoint \\
    --policy.config BiS1_Policy_offline_release \\
    --policy.dir checkpoints/BiS1_Policy_offline_release/mix_failure/18000
\`\`\`

**serve_policy.py 参数**：

|   |   |
|---|---|
|**参数**|**说明**|
|\`--port\`|服务端口 (默认 8000)|
|\`--default_prompt\`|当数据中无 prompt 时的默认任务描述|
|\`--record\`|录制策略行为用于调试|
|\`--log_file\`|将每次推理的动作/状态写入 JSONL 文件|
|\`policy:checkpoint --policy.config\`|训练配置名|
|\`policy:checkpoint --policy.dir\`|检查点目录|

开启上述服务端的策略推理服务之后，开启数据采集端和部署端的连接。注意控制模式模式需要为 \`policy\` 或者 \`mixed\`

\`\`\`bash
cd robodeploy

# 推荐方式：Shell 脚本启动（交互式菜单选择控制模式）
bash scripts/record_hybrid.sh
\`\`\`

> **注意**：选择 \`mixed\` 模式，可以进入混合模式（P 键实时切换，进行人工干预），人工干预保存的数据可加入数据集进行数据集增强

## 5. 价值模型训练

价值模型在 Policy backbone 上附加 Value Head (3层 MLP)，分两阶段训练。

\`\`\`bash
cd policy_and_value/policy_offline_and_value

# 方式一：手动分步训练
# Stage 1: 仅 Progress Loss（预训练 value head）
bash train.sh BiS1_value_release_stage1 8

# Stage 2: Progress Loss + TD Learning（微调，从 stage1 的 4000 步 checkpoint 恢复）
bash train.sh BiS1_value_release 8

# 方式二：自动链式训练（stage1 → stage2 自动衔接）
bash scripts/train_bis1_value_chain.sh 8
\`\`\`

**bi_s1 价值模型 Config**：

|   |   |   |   |
|---|---|---|---|
|**Config 名称**|**阶段**|**特点**|**训练步数**|
|\`BiS1_value_release_stage1\`|Stage 1|Progress Loss only, TD disabled|4k|
|\`BiS1_value_release\`|Stage 2|Progress + TD Loss (γ=0.995, τ=0.01)|20k|

**关键参数**：

|   |   |   |
|---|---|---|
|**参数**|**值**|**说明**|
|\`value_gamma\`|0.995|TD 折扣因子|
|\`value_TD_TAU\`|0.01|目标网络软更新系数|
|\`value_failure_reward\`|-1.0|失败 episode 的终端奖励|
|\`value_terminal_window\`|10|终端奖励窗口大小|
|\`loss_value_use_bce\`|False|使用 MSE loss|
|\`p_with_progress_loss\`|1.0|Progress loss 概率|

## 6. Advantage 标注与模型训练

用训练好的价值模型对数据集逐帧推理 frame_value，计算 action_advantage。

\`\`\`bash
cd policy_and_value/policy_offline_and_value

# 一键标注（三步自动完成：推理 frame_value → 写入 parquet → 计算 advantage）
bash label_value.sh BiS1_value_release checkpoints/BiS1_value_release/BiS1_value_release/18000

# 输出：数据集目录_w_adv/ （parquet 新增 frame_value, frame_value_smooth, action_advantage 列）
\`\`\`

**三步流水线** (\`examples/label_frame_value.py\`)：

|   |   |
|---|---|
|**步骤**|**说明**|
|1. 模型推理|逐 batch 推理每帧 \`frame_value\`，写入临时 .npy|
|2. 写入列|\`add_column_from_disk()\` 将 \`frame_value\` 追加到 parquet|
|3. 计算 advantage|\`smooth_value_and_compute_advantage()\` 计算 \`frame_value_smooth\` 和 \`action_advantage\`|

**advantage 计算公式** (MODE=v1)：

\`\`\`
action_advantage[t] = avg(V[t+1], ..., V[t+CHUNK_SIZE]) - V[t]
然后 × ADVANTAGE_SCALER
\`\`\`

**专家/推理数据混合处理**（数据集含 \`is_infer_data\` 字段时自动区分）：

- 专家数据 (\`is_infer_data=0\`)：\`action_advantage = 1.0\`（恒定，完全模仿专家）
- 推理数据 (\`is_infer_data=1\`)：从 frame_value 计算 advantage

**关键参数** (对齐 RL 配置 \`rl_release_bi_s1_wm_rm.yaml\`)：

|   |   |   |   |
|---|---|---|---|
|**参数**|**脚本变量**|**默认值**|**RL 配置对应**|
|前瞻步数|\`CHUNK_SIZE\`|50|\`num_action_chunks: 50\`|
|放大因子|\`ADVANTAGE_SCALER\`|5.0|\`advantage_scale: 5\`|
|平滑窗口|\`N_SMOOTH\`|3 (当前关闭)|-|

**纯专家数据快速标注**（不经过价值模型）：

\`\`\`bash
# 直接给所有帧赋 action_advantage = 1.0
python examples/aloha_real/add_reward_quality_label.py
# 修改脚本中的 data_roots 为数据集路径，输出 _w_adv_expert/
\`\`\`

**可视化已标注数据**（离线，不跑模型）：

\`\`\`bash
python examples/visualize_frame_value_and_advantage.py \\
    --dataset_root <数据集>_w_adv \\
    --chunk chunk-000 \\
    --output_dir ./visual_labeled
# 输出: visual_labeled/<数据集名>/episode_000000_vis.mp4
\`\`\`

**可视化价值模型预测**（在线，加载模型推理）：

\`\`\`bash
python examples/visualize_value_only.py \\
    --config_name BiS1_value_release \\
    --ckpt_dir path/to/checkpoint \\
    --output_dir ./value_vis \\
    --max_vis_episodes 5 \\
    --split all \\
    --headview_only
\`\`\`

**标注脚本可选参数**：

|   |   |   |
|---|---|---|
|**参数**|**默认值**|**作用**|
|\`--split\`|\`all\`|数据集分片 (\`all\` / \`val_tasks\` / \`heldout_tasks\`)|
|\`--batch_size\`|\`64\`|推理 batch size|
|\`--with_vis\` / \`--no-with_vis\`|默认开|推理时是否同步生成可视化|
|\`--max_vis_episodes\`|\`3\`|最多可视化 episode 数|
|\`--headview_only\`|False|只显示 front 视角|
|\`--metric_only\`|False|只统计数值，跳过所有视频渲染|

**标注完成后，训练****带 advantage 条件的** π**0.5 策略**

\`\`\`bash
cd policy_and_value/policy_offline_and_value

# bi_s1 示例：不带 advantage 条件的 π0.5 策略
bash train.sh BiS1_Policy_offline_release 8
\`\`\`

## 7. 世界模型训练 (\`dynamics/dynamics_model/\`)

基于 LTX-Video 的扩散世界模型，用于预测动作条件下的未来视频帧。

### 7.1 下载预训练权重

\`\`\`bash
cd dynamics/dynamics_model
bash download.sh
\`\`\`

### 7.2 视频预处理

将数据集视频缩放到 256×192（动力学模型所需尺寸）。

\`\`\`bash
# 预处理指定数据集（支持绝对路径或相对 dataset/ 下的目录名）
bash preprocess.sh bi_s1_full_merged

# 或指定绝对路径
bash preprocess.sh /path/to/dataset
\`\`\`

### 7.3 计算动作归一化统计量

\`\`\`bash
# 计算动作统计量并保存到 JSON 配置文件
python norm.py \\
    --dataset-dir /home/kemove/RISE/deploy/data_collection/s1_data/lerobot/ \\
    --datasets bi_s1_full_merged \\
    --save-config /home/kemove/RISE/deploy/data_collection/s1_data/lerobot/bi_s1_full_merged/norm_stats.json
\`\`\`

### 7.4 微调训练

\`\`\`bash
# 使用 torchrun 启动训练
bash scripts/train.sh main.py configs/ltx_model/finetune.yaml
\`\`\`

**训练前需确认** **\`finetune.yaml\`** **中的路径**：

|   |   |   |
|---|---|---|
|**配置项**|**说明**|**bi_s1 示例值**|

## π0.5

该仓库的具身模型基于**π0.5**进行微调。π0.5 是由 Physical Intelligence 公司发布的视觉-语言-动作（VLA）模型，作为 π0 的迭代升级版本，其核心特点包括：

- **异构数据协同训练**：融合多源异构数据进行联合训练，显著提升模型在陌生环境中的泛化能力，首次实现了端到端机器人在全新家庭环境中执行长时程灵巧操作任务（如叠毛巾、整理床铺等，单次任务持续 10–15 分钟）；
- **知识绝缘架构（π0.5-KI）**：将动作专家模块模块化“嫁接”至视觉-语言模型，在增强动作生成能力的同时不侵蚀预训练的语义知识，实现“高效训练、强泛化、高精度运动控制”三重目标；
- **分层推理机制**：先预测高层语义子任务，再执行低层连续动作，实现抽象任务指令到具体关节控制的端到端映射；
- **GemmaRMSNorm 动态调节**：在 Transformer 每一层动态调节归一化层，使模型在动作生成的不同阶段具有差异化行为，实现更精细的动作控制。

具体细节请参考：

- 参考论文：[https://www.pi.website/blog/pi05](https://www.pi.website/blog/pi05)
- 参考代码：[https://github.com/Physical-Intelligence/openpi/tree/main](https://github.com/Physical-Intelligence/openpi/tree/main)

## Advantage策略模型

Advantage策略模型，取自于 Physical Intelligence发布的 **π*********0.6**。其核心创新在于 RECAP 训练方法——通过“示范学习、纠错指导、自主实践”三阶段闭环，让机器人能够从真实执行中积累经验、从错误中自主成长，突破传统模仿学习的瓶颈。

- **RECAP训练方法**：全称为“基于优势条件策略的经验与纠偏强化学习”，该方法整合演示数据、在线自主收集的实践数据以及人类专家的干预数据，分为“示范学习、纠错指导、自主实践”三个阶段，使机器人能够从真实执行中积累经验、从错误中自主成长，彻底突破了传统模仿学习只能逼近“真值”的局限。
- **价值函数（Value Function）** ：RECAP的核心组件之一，用于评估任务进展并预测完成某项任务所需的预期时间。该价值函数基于大规模多机器人多任务数据训练，能够为轨迹中的每个动作提供质量评估，从而区分“好动作”与“坏动作”。
- **优势信号（Advantage）** ：价值函数计算出每个动作的实际回报与预测价值之间的差值，即优势值A(s,a) = Q(s,a)−V(s)。该优势值用于区分当前动作相比“平均表现”的优势程度，并通过二值化处理形成高/低优势指标，作为策略训练的额外输入，使模型能够在推理时强制选择高优势动作，从而直接从数据中提取出比原始数据更优的决策策略。

**具体细节请参考：**

- 参考论文：[https://www.pi.website/blog/pistar06](https://www.pi.website/blog/pistar06)

## 基于世界模型的在线强化

该仓库的世界模型，取自于**RISE**（Reinforcement learning via Imagination for Self-Improving robots），面向真实世界机器人操作的**在线强化学习框架**，核心创新在于将物理环境交互迁移至**想象空间**，通过构建**组合式世界模型**实现策略持续自我提升。

**主要特点**：

- **组合式世界模型**：将仿真任务解耦为动态模型（基于高效视频扩散模型，预测多视角未来状态）与价值模型（基于预训练 VLA 骨干，输出稠密进度信号），两者独立优化，兼顾视觉真实性与控制可控性。
- **想象空间在线强化学习**：无需真实世界的昂贵、串行、需人工重置的试错交互，直接在想象环境中展开动作序列，由价值模型计算优势信号（Advantage） ，驱动策略更新，实现可扩展的在线策略学习。
- **策略预热与自循环提升**：先通过离线数据（含专家演示、自主 rollout、人工纠正）进行优势条件化策略预热，再利用世界模型不断生成想象轨迹、评估优势、训练策略，形成闭环自提升。

**具体细节请参考：**

## 为什么需要 N→M 映射（NtoM Mapping）

### 问题背景

在机器人遥操作（Teleoperation）场景中，操作端（主手/采集设备/动作捕捉服）与执行端（从手/机器人/机械臂）几乎永远**不是同构型**的：

- 人形手套有 **22 个关节**，而目标灵巧手只有 **11 个电机**
- 动作捕捉服采集全身 **50+ DOF**，而目标机械臂只有 **6 个旋转关节**
- 主手是 **3 自由度操纵杆**，而目标是需要 **多关节协调** 的软体机器人

传统的 **1:1 关节映射**（N=M 且同构型）在此完全失效。我们必须回答一个问题：**如何用 N 个输入自由度，去控制 M 个输出自由度？**

### NtoM 映射的本质

NtoM 映射系统是一个**通用的自由度转换层**，它不关心两端的具体机械结构是否相同，只关心：

> 输入端的 N 个自由度（关节角度、姿态、力、位移等）→ 通过某种映射规则 → 输出端的 M 个自由度（关节角度、电机转速、位置指令等）

映射方式可以是：
- **直接映射**：一个输入关节对应一个输出关节（1:1）
- **线性映射**：多个输入的加权线性组合对应一个输出（n:1）
- **非线性映射**：通过 IK、优化、神经网络等引入非线性补偿
- **语义映射**：基于身体部位分组（如"左臂"→"左臂"），忽略具体关节数量差异

### 系统示意图

### 典型应用场景

| 场景 | 输入端 (N) | 输出端 (M) | 映射难点 |
|------|-----------|-----------|---------|
| **人形→机械臂** | 人体右臂 7-DOF | 工业臂 6-DOF | 肩关节球关节 vs 串联旋转关节，需 IK 补偿 |
| **手套→灵巧手** | 数据手套 22-DOF | 欠驱动灵巧手 11-DOF | 多输入合并为少输出，需耦合矩阵 |
| **操纵杆→多机协同** | 3-DOF 摇杆 | 2 台 6-DOF 机械臂 | 1 个输入分配给 12 个输出，需语义分组 |
| **动作捕捉→四足** | 人体全身 50+ DOF | 四足腿 12-DOF | 完全不同的拓扑结构，需 Skeleton-Agnostic 映射 |
| **肌电→假肢** | 2~4 通道肌电信号 | 多自由度假手 | 极度欠驱动，需隐空间/神经网络映射 |

### 为什么这是遥操作的"刚需"

1. **异构是常态，同构是例外**  
   商业遥操作设备（如 SenseGlove、Leap Motion）与目标机器人的自由度几乎不可能一一对应。

2. **自由度冗余/欠缺的天然矛盾**  
   人手臂有 7-DOF（冗余），工业臂通常 6-DOF（正好），欠驱动灵巧手可能只有 4-DOF（不足）。N≠M 是普遍情况。

3. **任务空间 vs 关节空间的鸿沟**  
   操作者关心的是"末端去哪里"（任务空间），但机器人接收的是"电机转多少"（关节空间）。NtoM 映射系统正是架在这两者之间的转换层。

4. **灵活性的工程需求**  
   遥操作场景经常变化（今天控机械臂，明天控灵巧手），需要一套**与具体构型解耦**的通用映射框架，而不是为每一对设备写硬编码。

### 安装

\`\`\`bash
pip install -e .
# 或安装可视化依赖
pip install -e ".[viz]"

### Python API

\`\`\`python
from retargeting_anything import create_humanoid_skeleton, create_robot_arm_skeleton
from retargeting_anything.mappers import create_mapper

# 创建结构
source = create_humanoid_skeleton(scale=1.0)
target = create_robot_arm_skeleton()

# 加载/创建运动数据
source_motion = ...

# 创建映射器并执行映射
mapper = create_mapper("ik", source, target, position_scale=1.5)
target_motion = mapper.map_motion(source_motion)
\`\`\`

### CLI 工具

\`\`\`bash
# 生成示例骨骼
retarget generate-skeleton --type humanoid --output human.json
retarget generate-skeleton --type robot_arm --output robot.json

# 执行映射
retarget map \\
    --source-skeleton human.json \\
    --target-skeleton robot.json \\
    --source-motion motion.npz \\
    --mapper ik \\
    --output result.npz

# 可视化
retarget visualize --motion result.npz --frame 0 --output frame.png

# 查看所有映射器
retarget list-mappers
\`\`\`

### 自定义映射配置

\`\`\`yaml
name: my_custom_mapping
source_skeleton: human
target_skeleton: robot

global_settings:
  position_scale: 1.5

mappings:
  # 一对一映射
  - source: right_shoulder
    target: joint1
    type: direct
  
  # 带缩放映射
  - source: right_elbow
    target: joint2
    type: scaled
    scale: 1.2
  
  # 多对一混合
  - source: [left_shoulder, right_shoulder]
    target: torso
    type: multi_source
    weights: [0.5, 0.5]
  
  # 末端执行器映射
  - source: right_wrist
    target: end_effector
    type: end_effector
\`\`\`

## 技术背景

本项目基于以下机器人运动控制领域的映射算法研究：

- **Configuration Space Retargeting**：关节空间直接映射 [1]
- **Task Space Retargeting + IK**：任务空间映射 + 逆运动学 [2]
- **Shared Latent Space** (ImitationNet, Neural Latent Optimization)：跨结构共享隐空间 [3,4]
- **Skeleton-Agnostic Networks** (PALUM, SAN)：Transformer/GNN 处理任意拓扑 [5,6]
- **End-Effector Trajectory Mapping** (TrajBooster)：末端执行器作为共享接口 [7]
- **Contact-Aware Retargeting**：接触约束保持 [8]

## 二、特异型灵巧手指安装平台

### 2.1 产品概述
面向协作机械臂末端与灵巧手系统的**五指安装平台**，采用**正五边形模块化结构**设计，内置 5 个旋转驱动电机，每根手指可实现 **0°~360° 连续旋转**。适配 ISO 9409-1-31.5/40/50/63 标准机械臂末端法兰盘。是构建完整灵巧手系统的核心承载与旋转定位中间层。

### 2.2 核心参数

| 参数项 | 规格 |
|:---|:---|
| 结构形式 | 正五边形模块化结构 |
| 主动自由度 | 5（旋转驱动电机 ×5） |
| 旋转范围 | 0° ~ 360° 连续旋转 |
| 传动方式 | 推力球轴承 + 电机壳旋转 |
| 适配法兰 | ISO 9409-1-31.5/40/50/63 |
| 通信方式 | 由所选旋转电机决定（推荐 CAN 总线） |
| 节点容量 | 最多 16 个节点共线（可与手指节点共享总线） |

### 2.3 结构特征

| 结构部件 | 连接方式 | 技术要点 |
|:---|:---|:---|
| 底盒 | 与机械臂末端法兰对接 | 提供整体承载基础，ISO 规格匹配 |
| 顶壳 | M3×10 平头螺丝（5 颗）与底盒连接 | 力矩 0.5~0.8 N·m，五边形对角顺序拧紧 |

| 手指安装位 | 每指 8 颗 M2×3 螺丝固定于电机壳 | 力矩 0.15~0.2 N·m，对角顺序拧紧 |

### 2.4 标准工作流程

1. **上电初始化**：各旋转轴回零或到达预设初始角度
2. **构型规划**：上位机根据任务需求计算各手指朝向目标角度
3. **旋转定位**：5 个旋转轴独立或同步运动至目标角度
4. **手指抓握**：手指执行抓握原语完成物体抓取
5. **协同操作**：旋转轴与手指协同完成复杂操作任务

\`\`\`
应用层（上位机）— 构型规划 / 视觉引导 / 手指协调控制

旋转驱动电机层（5 个电机，各自独立）— 位置控制 / 速度控制 / 编码器反馈
    ↓ 机械传动
执行层（电机壳 + 推力轴承 + 手指根部电机）— 手指旋转定位 / 手指抓取动作

## 三、无动力夹取手指

### 3.1 产品概述
面向纺织自动化、柔性物料搬运场景的无动力被动自适应布料夹爪，采用模块化可拆卸的**纯机械欠驱动结构**。依靠接触反力触发被动夹紧，通过内部**斜楔-连杆机构**实现自适应包络抓取。无需气/电动力源，依靠机械咬合与摩擦力实现轻薄、易变形布料的稳定抓取。适合纺织行业低成本、无气源/电源条件下的柔性物料自动化改造。

### 3.2 核心参数

| 参数项 | 规格 |
|:---|:---|
| 驱动方式 | 无动力源，纯机械被动自适应 |
| 机构类型 | 斜楔-连杆欠驱动机构 |
| 夹持原理 | 接触反力触发被动闭合，机械自锁保持 |
| 复位方式 | 弹性复位件 |
| 最大承受压力 | **50 N**（超载将导致滚柱断裂） |
| 应用场景 | 纺织自动化、布料分拣、柔性物料搬运 |
| 安装方式 | 法兰盘连接，可部署于协作机械臂末端 |

### 3.3 结构特征

- **斜楔-连杆机构**：工件反作用力驱动夹爪被动闭合，自适应贴合工件轮廓
- **弹性复位件**：无外力时自动张开至最大开度
- **机械自锁**：闭合后结构自锁，无需持续供能即可保持抓持
- **模块化可拆卸**：便于维护与更换磨损件

### 3.4 标准工作流程

| 步骤 | 操作 | 预计时间 | 判定条件 |
|:---|:---|:---|:---|
| 1 | 初始状态复位（弹性复位件张开） | ~300 ms | 到达机械限位，无卡顿 |
| 2 | 物体预定位（机械臂运动） | 视任务而定 | — |
| 3 | 被动自适应抓取（下压触发闭合） | ~150 ms | 完全贴合，结构自锁，无打滑 |
| 4 | 工件搬运与保持 | 视任务周期 | 无外力干扰时保持闭合 |
| 5 | 工件释放（抬起即张开） | ~100 ms | 工件脱离，夹爪回到张开状态 |

### 3.5 与通用夹爪对比

| 对比维度 | 无动力夹取手指 | 传统有源夹爪 |
|:---|:---|:---|
| 动力源 | 无需气/电源 | 需气源或电源 |
| 成本 | 低（无驱动器/传感器） | 高 |
| 维护 | 简单（纯机械） | 复杂（电气维护） |
| 适应性 | 自适应包络（被动） | 依赖控制算法 |
| 适用场景 | 布料/轻薄柔性物料 | 刚性/标准几何体 |

### 3.6 安全与维护要点

| 项目 | 要求 |
|:---|:---|
| 安装固定 | 连接法兰必须刚性固定，螺栓按规定扭矩锁紧；严禁使用变形/滑牙紧固件 |
| 负载限制 | 最大压力 **50 N**，超载将导致滚柱断裂 |
| 碰撞防夹 | 运行路径内严禁放置人体部位、线缆或异物；卡滞后必须停机断电排查 |
| 定期检查 | 检查钳口、连杆、弹簧、销轴等关键受力件是否有磨损、变形或裂纹 |
| 维护保养 | 必须在完全停机、断电状态下进行 |

## 四、有动力夹取手指

### 4.1 产品概述
面向精密装配、异形物体抓取与接触式感知任务的**主动驱动灵巧手指模块**，采用模块化可拆卸设计，具备 **3 自由度主动驱动**、力/触觉多模态感知和快速拆装接口。适用于非标准几何体自适应包络抓持、细径物体捏取、插孔装配等对指尖灵巧度和环境感知能力要求较高的场景。

### 4.2 核心参数

| 参数项 | 规格 |
|:---|:---|
| 主动自由度 | 3（MCP 近关节、PIP 中关节、DIP 远关节） |
| 驱动电机 | BLDC 电机 ×3 |
| 减速机构 | 谐波减速器 |
| 耦合传动 | DIP 与 PIP 固定传动比 1:1.2 ~ 1:1.5（固件可调） |
| 指尖力 | 12 N（额定） |
| 捏取载荷 | 0.8 kg |
| 包络载荷 | 2 kg |
| 供电电压 | 24 V DC（范围 20~30 V） |
| 控制模式 | 位置控制 / 力位混合控制 / 阻抗控制 |
| 感知能力 | 六维力/力矩 + 16×16 触觉阵列 |
| 通信接口 | CAN / CAN FD（推荐）、RS-485、UART（调试） |
| 总线节点数 | 最多 16 个节点共线 |

### 4.3 自由度配置与角度范围

| 关节 | 解剖学命名 | 类型 | 运动方向 | 角度范围 |
|:---|:---|:---|:---|:---|
| MCP | 掌指关节 | 主动 | 屈伸 | 0° ~ 屈曲最大角 |
| PIP | 近端指间关节 | 主动（与 DIP 耦合） | 屈伸 | 0° ~ 屈曲最大角 |
| DIP | 远端指间关节 | 主动（与 PIP 耦合） | 屈伸 | 0° ~ 屈曲最大角 |

> 伸展方向为 0°，弯曲方向为正。单指模块不支持主动侧摆，集成于手掌时可通过手掌 MP 关节实现。

### 4.4 标准工作流程

| 步骤 | 操作 | 预计时间 | 判定条件 |
|:---|:---|:---|:---|
| 1 | 上电初始化（自检） | ~500 ms | 绿灯常亮 |
| 2 | 总线连接（CAN） | ~100 ms | 收到心跳帧 |
| 3 | 参数配置（模式/力阈值/耦合比） | ~50 ms | 配置确认应答 |
| 4 | 执行 HOME 原语 | ~300 ms | 三关节回到 0° |
| 5 | 物体接近（机械臂运动） | 视任务而定 | 视觉/激光定位完成 |
| 6 | 执行抓握原语（GRASP_ENVELOPE / PINCH） | 150~500 ms | 力传感器 ≥ 目标力 |
| 7 | 保持抓握（HOLD） | 视任务而定 | 无滑移报警 |
| 8 | 运输/操作 | 视任务而定 | 加速度/振动在允许范围内 |
| 9 | 释放（RELEASE） | 200~400 ms | 指尖力归零 |
| 10 | 返回 HOME 或进入待机 | — | 准备下一次任务 |

### 4.5 控制架构（四级分层）

\`\`\`
应用层（上位机）— 任务规划 / 视觉引导 / 力控算法 / 学习算法
    ↓ ROS2 Topic / CAN Protocol
运动规划层（PC端，可选）— 轨迹生成 / 逆运动学 / 碰撞检测 / 多指协调
    ↓ CAN / CAN FD
关节控制层（手指内置 MCU，480 MHz）— PID+前馈 / 力位混合 / 阻抗控制 / 安全监控
    ↓ PWM + FOC
驱动层（BLDC×3 / 谐波减速器 / 编码器 / 传感器）
\`\`\`

### 4.6 力位混合控制逻辑

1. **位置控制阶段**：指尖力 < 力切换阈值（默认 0.5 N）时，按位置控制运动
2. **切换条件**：指尖力 ≥ 力切换阈值 → 自动切换到力控制
3. **力控制阶段**：根据目标力与当前力偏差调整关节力矩，维持稳定接触力
4. **切换回位置控制**：接触力降至阈值以下且持续 100 ms 时自动恢复

可调参数：
- \`force_threshold\`：0.1 ~ 10 N（默认 0.5 N）
- \`target_force\`：0 ~ 12 N
- \`kp_position\`：0 ~ 1000
- \`kp_force\`：0 ~ 100

### 4.7 通信接口（8pin 连接器）

- **推荐协议**：CAN / CAN FD（1 Mbps）
- **节点 ID**：可配置，多指组网时通过 ID 区分
- **拓扑**：菊花链，总线两端各接 120Ω 终端电阻
- **RS-485 与 CAN 共用差分线对**，需通过跳线选择，不可同时使用

### 4.8 SDK/API 支持

| 接口类型 | 支持平台 | 编程语言 | 主要功能 |
|:---|:---|:---|:---|
| Python SDK | Ubuntu 22.04/24.04 | Python 3.10+ | 初始化、模式设置、原语调用、传感器读取 |
| C++ SDK | Ubuntu 22.04/24.04 | C++17 | 低延迟实时控制 |
| ROS2 驱动 | Ubuntu 22.04/24.04 | Python/C++ | Topic 订阅发布、Service 调用 |

**Python 快速示例**：
\`\`\`python
from specialized_finger import FingerController
finger = FingerController(interface='can0', node_id=1)
finger.connect()
finger.home()
finger.set_mode(FingerController.MODE_FORCE_POSITION)
finger.set_force_threshold(1.0)
finger.set_target_force(3.0)
result = finger.grasp_envelope(max_angle=90)
force = finger.get_force_torque()   # [Fx, Fy, Fz, Mx, My, Mz]
tactile = finger.get_tactile()       # 16×16 数组
finger.release()
finger.disconnect()
\`\`\`

### 4.9 安全与维护要点

| 项目 | 要求 |
|:---|:---|
| 供电 | 24 V DC，严禁交流或 >30 V DC |
| 过温保护 | >60°C 自动切断电机输出，冷却至 <40°C 后恢复 |
| 碰撞处理 | 立即切断力矩 → 排除原因 → HOME → 绿灯常亮 → 继续 |
| 固件升级 | 严禁断电或拔插线缆，需在稳定供电环境下执行 |
| 安装力矩 | M6×16 螺钉：预紧 2 N·m → 最终 6 N·m |
| 终端电阻 | 总线末端节点需启用 120Ω 终端电阻 |
| 快拆基座 | 对准定位销推入，顺时针旋转至"咔嗒"声锁定；拆卸时按压卡扣逆时针旋转 |

## 五、手指快插拔模块

### 5.1 模块定位
**手指快插拔模块**是连接**有动力夹取手指**与**安装平台**（或机械臂末端）的机械接口模块，实现有动力手指的**秒级快速拆装**。该模块使同一安装平台能够根据不同任务需求快速更换不同构型的手指，大幅提升产线柔性。

### 5.2 结构特征

| 特征 | 说明 |
|:---|:---|
| 锁定机构 | 旋转卡扣式锁定，推入后顺时针旋转至"咔嗒"声确认 |
| 定位方式 | 定位销 + 防呆槽，确保电气与机械同轴对接 |
| 拆卸方式 | 按压卡扣按钮，逆时针旋转释放 |
| 电气接口 | 8pin 连接器与机械锁紧一体化，插接同时完成电气连通 |
| 承载能力 | 满足有动力手指额定负载（指尖力 12 N / 包络载荷 2 kg） |

### 5.3 安装要点

- **安装**：将手指快拆基座对准安装面定位销 → 推入到位 → 顺时针旋转锁定卡扣至"咔嗒"声确认锁定
- **拆卸**：按压卡扣按钮 → 逆时针旋转 → 释放取出
- **检查**：首次安装后确认无松动间隙，8pin 插头防呆槽对齐，插接到位听到锁定声

---

## 六、特异型手指寄存模块

### 6.1 模块定位
**特异型手指寄存模块**是为灵巧手系统配套的**离线手指存放与管理模块**。当安装平台需要更换手指构型（如从三指抓取切换为两指捏取）或手指需要离线维护/校准时，寄存模块提供安全、有序的存放空间，避免手指散乱放置造成的损伤或遗失。

### 6.2 功能特征

| 特征 | 说明 |
|:---|:---|
| 存放容量 | 【根据设计确定，如：可同时存放 3~5 根有动力手指】 |
| 定位固定 | 每根手指有独立的存放位，带有与快插拔模块匹配的定位结构 |
| 电气保护 | 存放位不带电，避免离线手指的电气短路或误触发 |
| 防护设计 | 防尘/防碰撞外壳，保护离线手指的精密结构 |
| 模块化 | 可独立部署于工作台或集成于产线设备旁 |

### 6.3 使用方式

1. 从安装平台拆卸手指（按压快插拔卡扣 → 逆时针旋转 → 取出）
2. 将手指对准寄存模块存放位的定位销
3. 推入至限位，确认手指稳固无晃动
4. 需要使用时取出，安装至安装平台即可

## 八、系统集成方案

### 8.1 完整五指灵巧手系统

\`\`\`
协作机械臂末端（ISO 9409-1 法兰）
    ↓
特异型灵巧手指安装平台（底盒固定，5 旋转轴）
    ↓（通过手指快插拔模块连接）
5 × 有动力夹取手指（安装于电机壳）
    ↓
CAN 总线统一连接（最多 16 节点：5 旋转轴 + 5 手指 = 10 节点）
    ↓
上位机（PC/工控机，ROS2 / 自定义控制软件）
\`\`\`

> 当需要更换手指构型时，通过快插拔模块秒级拆卸/安装手指；离线手指存放于**特异型手指寄存模块**。

### 8.2 布料抓取专用系统

\`\`\`
协作机械臂末端
    ↓
无动力夹取手指（法兰连接）
    ↓
无需电气连接，纯机械操作
    ↓
上位机仅控制机械臂运动轨迹
\`\`\`

### 8.3 混合配置方案

在需要同时处理刚性物体和柔性布料的产线中，可采用**快换装置**实现有动力手指/无动力夹爪的快速切换：
- 刚性/精密任务 → 有动力夹取手指（通过快插拔模块安装在安装平台上）
- 布料/柔性物料任务 → 无动力夹取手指（独立安装在快换装置上）
- 离线手指管理 → 特异型手指寄存模块
