const MD_product-dualArmRobot = `# DM-Robot 双臂机器人产品资料

> 针对柔性操作工业落地市场的机器人公司 — 双臂机器人产品线主仓

\`product-dualArmRobot\` 是双臂机器人产品线的完整资料主仓，包含三款桌面级机械臂型号的机械图纸、控制软件、媒体资料和技术文档。

---

## 仓库定位

- **产品主仓**：本仓为双臂机器人产品的完整资料主源，覆盖机械、电气、固件、软件、系统、文档和测试七大子系统。
- **README 负责直接展示入口**；分类 README 负责按任务分流；子目录 README 负责目录入口。
- 具体安装、使用、调试步骤继续放在目录内的 \`README.md\`、\`USAGE.md\`、\`SETUP.md\` 和流程文档中。

---

## 高频入口

- [1.桌面级六轴机械臂(dm_abb)](#1桌面级六轴机械臂dm_abb) — C# WinForms 上位机 + Unity 数字孪生
- [2.3D 打印机械臂(dm_3dprinting)](#23d-打印机械臂dm_3dprinting) — 全 3D 打印结构件 STL
- [3.UR 构型机械臂(dm_ur)](#3ur-构型机械臂dm_ur) — Python 控制例程 + 逆运动学

---

## 仓库地图

| 路径 | 内容 | 建议先看 |
|------|------|----------|
| \`1.dm_abb_desktop_arm/\` | 桌面级六轴机械臂(dm_abb)资料 | \`1.dm_abb_desktop_arm/README.md\` |
| \`2.dm_3dprinting_arm/\` | 3D 打印机械臂(dm_3dprinting)资料 | \`2.dm_3dprinting_arm/README.md\` |
| \`3.dm_ur_arm/\` | UR 构型机械臂(dm_ur)资料 | \`3.dm_ur_arm/README.md\` |
| \`docs/\` | 产品总览技术文档 | \`docs/机械臂介绍(6).pdf\` |

---

## 三款机械臂概览

### 1.桌面级六轴机械臂(dm_abb)

面向动力学算法、力位控制、数字孪生可视化的桌面级 6 轴机械臂实验平台。

- **控制方式**：C# WinForms 上位机，CAN 总线通讯，500 Hz~1 kHz 控制频率
- **核心功能**：正逆运动学、动力学模型、PID / 前馈 / 阻抗 / 滑模控制、Unity 数字孪生
- **LeRobot 支持**：计划提供数据采集、模型训练、模型部署完整流程
- **资料入口**：[\`1.dm_abb_desktop_arm/\`](https://github.com/SuppartWang/product-dualArmRobot/tree/main/1.dm_abb_desktop_arm)

### 2.3D 打印机械臂(dm_3dprinting)

全 3D 打印结构件构成的低成本桌面机械臂。

- **结构特点**：底座、杆件、关节连接块、外壳等全部可 3D 打印
- **文件格式**：STL 零件文件，可直接导入切片软件打印
- **资料入口**：[\`2.dm_3dprinting_arm/\`](https://github.com/SuppartWang/product-dualArmRobot/tree/main/2.dm_3dprinting_arm)

### 3.UR 构型机械臂(dm_ur)

6 自由度 UR 构型机械臂，基于达妙(DM)电机驱动，提供完整的 Python 控制例程和逆运动学求解。

- **电机配置**：DM4340(关节 1-4) + DM4310(关节 5-6) + DM4310(夹爪)
- **通讯方式**：USB 转 CAN 适配器，波特率 921600
- **软件栈**：Python 3.7+，完整关节空间/笛卡尔空间控制、TCP 工具坐标系
- **资料入口**：[\`3.dm_ur_arm/\`](https://github.com/SuppartWang/product-dualArmRobot/tree/main/3.dm_ur_arm)

---

## 快速开始

\`\`\`bash
git clone https://github.com/SuppartWang/product-dualArmRobot.git
cd product-dualArmRobot
\`\`\`

按型号选择对应目录阅读该目录的 README 和流程文档：

- 需要 **动力学算法平台 / 数字孪生** → 进入 \`1.dm_abb_desktop_arm/\`
- 需要 **3D 打印结构件** → 进入 \`2.dm_3dprinting_arm/\`
- 需要 **Python 控制例程 / 逆运动学** → 进入 \`3.dm_ur_arm/\`


## 支持与安全
- 技术文档：\`docs/机械臂介绍(6).pdf\`
- 客户帮助与售后支持：请按当前官方支持渠道获取

    let currentProject = 'dualArmRobot';

    function renderProject(id) {
      currentProject = id;
      const proj = projects.find(p => p.id === id);
      if (!proj) return;

      // Update sidebar active state
      document.querySelectorAll('.nav-item').forEach(el => {
        el.classList.remove('active-nav');
        if (el.dataset.id === id) el.classList.add('active-nav');
      });

      // Render markdown
      const html = marked.parse(proj.md);
      document.getElementById('content').innerHTML = html;
      document.getElementById('page-title').textContent = proj.name;
      document.getElementById('github-link').href = proj.url;

      // Scroll to top
      document.getElementById('content').scrollTop = 0;
      window.scrollTo(0, 0);
    }

    function toggleTheme() {
      const html = document.documentElement;
      html.classList.toggle('dark');
      localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
    }

    // Init theme
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') document.documentElement.classList.add('dark');
    else if (savedTheme === 'light') document.documentElement.classList.remove('dark');
    else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.classList.add('dark');
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderProject(currentProject);
    });
  </script>
