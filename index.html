> 本文档汇总了本项目三款核心产品文档的关键信息，覆盖安装平台、无动力夹取手指、有动力夹取手指及其配套模块（快插拔模块、寄存模块），便于研发、采购及系统集成时统一查阅。

> 编制日期：2026-05-26

## 一、项目概览

本项目围绕**柔性操作专用灵巧手系统**展开，核心硬件可分为以下四个功能单元：

| 功能层级 | 产品/模块名称 | 功能定位 | 驱动方式 |
|:---|:---|:---|:---|

- **特异型手指寄存模块**为离线手指提供安全存放空间，支持产线中手指的缓存与备用管理。

---

## 二、特异型灵巧手指安装平台

### 2.1 产品概述
面向协作机械臂末端与灵巧手系统的**五指安装平台**，采用**正五边形模块化结构**设计，内置 5 个旋转驱动电机，每根手指可实现 **0°~360° 连续旋转**。适配 ISO 9409-1-31.5/40/50/63 标准机械臂末端法兰盘。是构建完整灵巧手系统的核心承载与旋转定位中间层。

### 2.2 核心参数

| 参数项 | 规格 |
|:---|:---|
| 结构形式 | 正五边形模块化结构 |
| 主动自由度 | 5（旋转驱动电机 ×5） |
| 旋转范围 | 0° ~ 360° 连续旋转 |
| 传动方式 | 推力球轴承 + 电机壳旋转 |
| 适配法兰 | ISO 9409-1-31.5/40/50/63 |
| 通信方式 | 由所选旋转电机决定（推荐 CAN 总线） |
| 节点容量 | 最多 16 个节点共线（可与手指节点共享总线） |

### 2.3 结构特征

| 结构部件 | 连接方式 | 技术要点 |
|:---|:---|:---|
| 底盒 | 与机械臂末端法兰对接 | 提供整体承载基础，ISO 规格匹配 |
| 顶壳 | M3×10 平头螺丝（5 颗）与底盒连接 | 力矩 0.5~0.8 N·m，五边形对角顺序拧紧 |
| 旋转电机 | M2×3 螺丝固定于顶壳（每电机 3 颗） | 力矩 0.15~0.2 N·m，1.5 mm 内六角扳手 |
| 电机壳 | 推力球轴承支撑 | 带动手指根部电机整体旋转 |
| 手指安装位 | 每指 8 颗 M2×3 螺丝固定于电机壳 | 力矩 0.15~0.2 N·m，对角顺序拧紧 |

### 2.4 标准工作流程

1. **上电初始化**：各旋转轴回零或到达预设初始角度
2. **构型规划**：上位机根据任务需求计算各手指朝向目标角度
3. **旋转定位**：5 个旋转轴独立或同步运动至目标角度
4. **手指抓握**：手指执行抓握原语完成物体抓取
5. **协同操作**：旋转轴与手指协同完成复杂操作任务

### 2.5 控制架构（直通式）

\`\`\`
应用层（上位机）— 构型规划 / 视觉引导 / 手指协调控制
    ↓ CAN / RS-485（直接控制）
旋转驱动电机层（5 个电机，各自独立）— 位置控制 / 速度控制 / 编码器反馈
    ↓ 机械传动
执行层（电机壳 + 推力轴承 + 手指根部电机）— 手指旋转定位 / 手指抓取动作
\`\`\`

> 本平台**不含独立控制器**，所有控制指令由上位机直接下发至各旋转电机。

### 2.6 通信拓扑

- 5 个旋转电机作为 5 个独立 CAN 节点
- 可与灵巧手手指节点**共享同一 CAN 总线**，通过节点 ID 区分
- 总线两端各接一个 120Ω 终端电阻

### 2.7 安装与安全要点

| 项目 | 要求 |
|:---|:---|
| 法兰盘安装 | 按对角线顺序分两步拧紧：预紧 2 N·m → 最终按法兰规格标准力矩 |
| 供电 | 严格按照所选电机额定电压供电，严禁超压 |
| 旋转碰撞 | 发送旋转指令前确认周边无障碍物 |
| 负载限制 | 不得超过单个旋转轴额定径向载荷 |
| 拆装操作 | 必须先断电，确认旋转轴静止后再操作 |
| 防水防尘 | 非密封结构，避免高湿度、多水雾、重粉尘环境 |
| 紧固件 | 严禁使用非标准螺丝；M2 螺丝力矩 ≤ 0.2 N·m |

## 三、无动力夹取手指

### 3.1 产品概述
面向纺织自动化、柔性物料搬运场景的无动力被动自适应布料夹爪，采用模块化可拆卸的**纯机械欠驱动结构**。依靠接触反力触发被动夹紧，通过内部**斜楔-连杆机构**实现自适应包络抓取。无需气/电动力源，依靠机械咬合与摩擦力实现轻薄、易变形布料的稳定抓取。适合纺织行业低成本、无气源/电源条件下的柔性物料自动化改造。

### 3.2 核心参数

| 参数项 | 规格 |
|:---|:---|
| 驱动方式 | 无动力源，纯机械被动自适应 |
| 机构类型 | 斜楔-连杆欠驱动机构 |
| 夹持原理 | 接触反力触发被动闭合，机械自锁保持 |
| 复位方式 | 弹性复位件 |
| 最大承受压力 | **50 N**（超载将导致滚柱断裂） |
| 应用场景 | 纺织自动化、布料分拣、柔性物料搬运 |
| 安装方式 | 法兰盘连接，可部署于协作机械臂末端 |

### 3.3 结构特征

- **斜楔-连杆机构**：工件反作用力驱动夹爪被动闭合，自适应贴合工件轮廓
- **弹性复位件**：无外力时自动张开至最大开度
- **机械自锁**：闭合后结构自锁，无需持续供能即可保持抓持
- **模块化可拆卸**：便于维护与更换磨损件

### 3.4 标准工作流程

| 步骤 | 操作 | 预计时间 | 判定条件 |
|:---|:---|:---|:---|
| 1 | 初始状态复位（弹性复位件张开） | ~300 ms | 到达机械限位，无卡顿 |
| 2 | 物体预定位（机械臂运动） | 视任务而定 | — |
| 3 | 被动自适应抓取（下压触发闭合） | ~150 ms | 完全贴合，结构自锁，无打滑 |
| 4 | 工件搬运与保持 | 视任务周期 | 无外力干扰时保持闭合 |
| 5 | 工件释放（抬起即张开） | ~100 ms | 工件脱离，夹爪回到张开状态 |

### 3.5 与通用夹爪对比

| 对比维度 | 无动力夹取手指 | 传统有源夹爪 |
|:---|:---|:---|
| 动力源 | 无需气/电源 | 需气源或电源 |
| 成本 | 低（无驱动器/传感器） | 高 |
| 维护 | 简单（纯机械） | 复杂（电气维护） |
| 适应性 | 自适应包络（被动） | 依赖控制算法 |
| 适用场景 | 布料/轻薄柔性物料 | 刚性/标准几何体 |

### 3.6 安全与维护要点

| 项目 | 要求 |
|:---|:---|
| 安装固定 | 连接法兰必须刚性固定，螺栓按规定扭矩锁紧；严禁使用变形/滑牙紧固件 |
| 负载限制 | 最大压力 **50 N**，超载将导致滚柱断裂 |
| 碰撞防夹 | 运行路径内严禁放置人体部位、线缆或异物；卡滞后必须停机断电排查 |
| 定期检查 | 检查钳口、连杆、弹簧、销轴等关键受力件是否有磨损、变形或裂纹 |
| 维护保养 | 必须在完全停机、断电状态下进行 |

## 四、有动力夹取手指

### 4.1 产品概述
面向精密装配、异形物体抓取与接触式感知任务的**主动驱动灵巧手指模块**，采用模块化可拆卸设计，具备 **3 自由度主动驱动**、力/触觉多模态感知和快速拆装接口。适用于非标准几何体自适应包络抓持、细径物体捏取、插孔装配等对指尖灵巧度和环境感知能力要求较高的场景。

### 4.2 核心参数

| 参数项 | 规格 |
|:---|:---|
| 主动自由度 | 3（MCP 近关节、PIP 中关节、DIP 远关节） |
| 驱动电机 | BLDC 电机 ×3 |
| 减速机构 | 谐波减速器 |
| 耦合传动 | DIP 与 PIP 固定传动比 1:1.2 ~ 1:1.5（固件可调） |
| 指尖力 | 12 N（额定） |
| 捏取载荷 | 0.8 kg |
| 包络载荷 | 2 kg |
| 供电电压 | 24 V DC（范围 20~30 V） |
| 控制模式 | 位置控制 / 力位混合控制 / 阻抗控制 |
| 感知能力 | 六维力/力矩 + 16×16 触觉阵列 |
| 通信接口 | CAN / CAN FD（推荐）、RS-485、UART（调试） |
| 总线节点数 | 最多 16 个节点共线 |

### 4.3 自由度配置与角度范围

| 关节 | 解剖学命名 | 类型 | 运动方向 | 角度范围 |
|:---|:---|:---|:---|:---|
| MCP | 掌指关节 | 主动 | 屈伸 | 0° ~ 屈曲最大角 |
| PIP | 近端指间关节 | 主动（与 DIP 耦合） | 屈伸 | 0° ~ 屈曲最大角 |
| DIP | 远端指间关节 | 主动（与 PIP 耦合） | 屈伸 | 0° ~ 屈曲最大角 |

> 伸展方向为 0°，弯曲方向为正。单指模块不支持主动侧摆，集成于手掌时可通过手掌 MP 关节实现。

### 4.4 标准工作流程

| 步骤 | 操作 | 预计时间 | 判定条件 |
|:---|:---|:---|:---|
| 1 | 上电初始化（自检） | ~500 ms | 绿灯常亮 |
| 2 | 总线连接（CAN） | ~100 ms | 收到心跳帧 |
| 3 | 参数配置（模式/力阈值/耦合比） | ~50 ms | 配置确认应答 |
| 4 | 执行 HOME 原语 | ~300 ms | 三关节回到 0° |
| 5 | 物体接近（机械臂运动） | 视任务而定 | 视觉/激光定位完成 |
| 6 | 执行抓握原语（GRASP_ENVELOPE / PINCH） | 150~500 ms | 力传感器 ≥ 目标力 |
| 7 | 保持抓握（HOLD） | 视任务而定 | 无滑移报警 |
| 8 | 运输/操作 | 视任务而定 | 加速度/振动在允许范围内 |
| 9 | 释放（RELEASE） | 200~400 ms | 指尖力归零 |
| 10 | 返回 HOME 或进入待机 | — | 准备下一次任务 |

### 4.5 控制架构（四级分层）

\`\`\`
应用层（上位机）— 任务规划 / 视觉引导 / 力控算法 / 学习算法
    ↓ ROS2 Topic / CAN Protocol
运动规划层（PC端，可选）— 轨迹生成 / 逆运动学 / 碰撞检测 / 多指协调
    ↓ CAN / CAN FD
关节控制层（手指内置 MCU，480 MHz）— PID+前馈 / 力位混合 / 阻抗控制 / 安全监控
    ↓ PWM + FOC
驱动层（BLDC×3 / 谐波减速器 / 编码器 / 传感器）
\`\`\`

### 4.6 力位混合控制逻辑

1. **位置控制阶段**：指尖力 < 力切换阈值（默认 0.5 N）时，按位置控制运动
2. **切换条件**：指尖力 ≥ 力切换阈值 → 自动切换到力控制
3. **力控制阶段**：根据目标力与当前力偏差调整关节力矩，维持稳定接触力
4. **切换回位置控制**：接触力降至阈值以下且持续 100 ms 时自动恢复

可调参数：
- \`force_threshold\`：0.1 ~ 10 N（默认 0.5 N）
- \`target_force\`：0 ~ 12 N
- \`kp_position\`：0 ~ 1000
- \`kp_force\`：0 ~ 100

### 4.7 通信接口（8pin 连接器）

- **推荐协议**：CAN / CAN FD（1 Mbps）
- **节点 ID**：可配置，多指组网时通过 ID 区分
- **拓扑**：菊花链，总线两端各接 120Ω 终端电阻
- **RS-485 与 CAN 共用差分线对**，需通过跳线选择，不可同时使用

### 4.8 SDK/API 支持

| 接口类型 | 支持平台 | 编程语言 | 主要功能 |
|:---|:---|:---|:---|
| Python SDK | Ubuntu 22.04/24.04 | Python 3.10+ | 初始化、模式设置、原语调用、传感器读取 |
| C++ SDK | Ubuntu 22.04/24.04 | C++17 | 低延迟实时控制 |
| ROS2 驱动 | Ubuntu 22.04/24.04 | Python/C++ | Topic 订阅发布、Service 调用 |

**Python 快速示例**：
\`\`\`python
from specialized_finger import FingerController
finger = FingerController(interface='can0', node_id=1)
finger.connect()
finger.home()
finger.set_mode(FingerController.MODE_FORCE_POSITION)
finger.set_force_threshold(1.0)
finger.set_target_force(3.0)
result = finger.grasp_envelope(max_angle=90)
force = finger.get_force_torque()   # [Fx, Fy, Fz, Mx, My, Mz]
tactile = finger.get_tactile()       # 16×16 数组
finger.release()
finger.disconnect()
\`\`\`

### 4.9 安全与维护要点

| 项目 | 要求 |
|:---|:---|
| 供电 | 24 V DC，严禁交流或 >30 V DC |
| 过温保护 | >60°C 自动切断电机输出，冷却至 <40°C 后恢复 |
| 碰撞处理 | 立即切断力矩 → 排除原因 → HOME → 绿灯常亮 → 继续 |
| 固件升级 | 严禁断电或拔插线缆，需在稳定供电环境下执行 |
| 安装力矩 | M6×16 螺钉：预紧 2 N·m → 最终 6 N·m |
| 终端电阻 | 总线末端节点需启用 120Ω 终端电阻 |
| 快拆基座 | 对准定位销推入，顺时针旋转至"咔嗒"声锁定；拆卸时按压卡扣逆时针旋转 |

## 五、手指快插拔模块

### 5.1 模块定位
**手指快插拔模块**是连接**有动力夹取手指**与**安装平台**（或机械臂末端）的机械接口模块，实现有动力手指的**秒级快速拆装**。该模块使同一安装平台能够根据不同任务需求快速更换不同构型的手指，大幅提升产线柔性。

### 5.2 结构特征

| 特征 | 说明 |
|:---|:---|
| 锁定机构 | 旋转卡扣式锁定，推入后顺时针旋转至"咔嗒"声确认 |
| 定位方式 | 定位销 + 防呆槽，确保电气与机械同轴对接 |
| 拆卸方式 | 按压卡扣按钮，逆时针旋转释放 |
| 电气接口 | 8pin 连接器与机械锁紧一体化，插接同时完成电气连通 |
| 承载能力 | 满足有动力手指额定负载（指尖力 12 N / 包络载荷 2 kg） |

### 5.3 安装要点

- **安装**：将手指快拆基座对准安装面定位销 → 推入到位 → 顺时针旋转锁定卡扣至"咔嗒"声确认锁定
- **拆卸**：按压卡扣按钮 → 逆时针旋转 → 释放取出
- **检查**：首次安装后确认无松动间隙，8pin 插头防呆槽对齐，插接到位听到锁定声

---

## 六、特异型手指寄存模块

### 6.1 模块定位
**特异型手指寄存模块**是为灵巧手系统配套的**离线手指存放与管理模块**。当安装平台需要更换手指构型（如从三指抓取切换为两指捏取）或手指需要离线维护/校准时，寄存模块提供安全、有序的存放空间，避免手指散乱放置造成的损伤或遗失。

### 6.2 功能特征

| 特征 | 说明 |
|:---|:---|
| 存放容量 | 【根据设计确定，如：可同时存放 3~5 根有动力手指】 |
| 定位固定 | 每根手指有独立的存放位，带有与快插拔模块匹配的定位结构 |
| 电气保护 | 存放位不带电，避免离线手指的电气短路或误触发 |
| 防护设计 | 防尘/防碰撞外壳，保护离线手指的精密结构 |
| 模块化 | 可独立部署于工作台或集成于产线设备旁 |

### 6.3 使用方式

1. 从安装平台拆卸手指（按压快插拔卡扣 → 逆时针旋转 → 取出）
2. 将手指对准寄存模块存放位的定位销
3. 推入至限位，确认手指稳固无晃动
4. 需要使用时取出，安装至安装平台即可

## 八、系统集成方案

### 8.1 完整五指灵巧手系统

\`\`\`
协作机械臂末端（ISO 9409-1 法兰）
    ↓
特异型灵巧手指安装平台（底盒固定，5 旋转轴）
    ↓（通过手指快插拔模块连接）
5 × 有动力夹取手指（安装于电机壳）
    ↓
CAN 总线统一连接（最多 16 节点：5 旋转轴 + 5 手指 = 10 节点）
    ↓
上位机（PC/工控机，ROS2 / 自定义控制软件）
\`\`\`

> 当需要更换手指构型时，通过快插拔模块秒级拆卸/安装手指；离线手指存放于**特异型手指寄存模块**。

### 8.2 布料抓取专用系统

\`\`\`
协作机械臂末端
    ↓
无动力夹取手指（法兰连接）
    ↓
无需电气连接，纯机械操作
    ↓
上位机仅控制机械臂运动轨迹
\`\`\`

### 8.3 混合配置方案

在需要同时处理刚性物体和柔性布料的产线中，可采用**快换装置**实现有动力手指/无动力夹爪的快速切换：
- 刚性/精密任务 → 有动力夹取手指（通过快插拔模块安装在安装平台上）
- 布料/柔性物料任务 → 无动力夹取手指（独立安装在快换装置上）
- 离线手指管理 → 特异型手指寄存模块
